[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "cwl2ro-crate"
dynamic = ["version"]
description = "Package CWL workflows and CWLProv runs as RO-Crates."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [
  { name = "Transpiler-Mate", email = "info@terradue.com" },
]
keywords = []
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
]
dependencies = [
  "transpiler-mate-api==1.0.0",
  "loguru==0.7.3",
  "cwltool>=3.1.20240508115724,<4",
  "cwl-utils>=0.40",
  "pydantic>=2,<3",
  "cwl-loader>=0.25.0",
  "rocrate==0.15.1",
  "cwlprov==0.2.1",
  "bdbag>=1.8,<2",
  "bagit>=1.9,<2",
  "networkx>=3.1,<4",
  "prov==1.5.1",
  "roc-validator==0.11.4"
]

[project.optional-dependencies]
test = [
  "pytest>=8.4,<10",
  "pytest-cov>=6.2,<8",
  "cwl-loader>=0.25.0",
  "transpiler-mate-runtime>=1.0.1,<2",
]

[project.entry-points."transpiler_mate.plugins"]
cwl2rocrate = "cwl2ro_crate.plugin:cwl2rocrate"

[project.urls]
Homepage = "https://github.com/Transpiler-Mate/cwl2ro-crate"
Documentation = "https://Transpiler-Mate.github.io/cwl2ro-crate/"
Repository = "https://github.com/Transpiler-Mate/cwl2ro-crate"
Issues = "https://github.com/Transpiler-Mate/cwl2ro-crate/issues"
Changelog = "https://github.com/Transpiler-Mate/cwl2ro-crate/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/cwl2ro_crate/__about__.py"

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/docs",
  "/README.md",
  "/CHANGELOG.md",
  "/LICENSE",
  "/NOTICE",
  "/THIRD_PARTY.md",
  "/pyproject.toml",
  "/mkdocs.yaml",
  "/requirements-docs.txt",
  "/CONTRIBUTING.md",
]

[tool.hatch.build.targets.wheel]
packages = ["src/cwl2ro_crate"]

[tool.hatch.build.targets.wheel.force-include]
"THIRD_PARTY.md" = "cwl2ro_crate/_vendor/THIRD_PARTY.md"

[tool.hatch.envs.types]
features = ["test"]
extra-dependencies = [
  "mypy==1.19.1",
]
[tool.hatch.envs.types.scripts]
check = "mypy --install-types --non-interactive {args:src/cwl2ro_crate tests}"

[tool.coverage.run]
source_pkgs = ["cwl2ro_crate"]
branch = true
parallel = true
omit = [
  "src/cwl2ro_crate/__about__.py",
]

[tool.coverage.paths]
cwl2ro_crate = ["src/cwl2ro_crate", "*/cwl2ro-crate/src/cwl2ro_crate"]

[tool.coverage.report]
exclude_lines = [
  "no cov",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]

[tool.hatch.envs.test]
skip-install = false
features = ["test"]

[tool.hatch.envs.test.scripts]
test = "pytest {args:tests}"
testv = "pytest --verbose {args:tests}"
test-cov = "pytest --cov=cwl2ro_crate --cov-report=term-missing {args:tests}"
test-show-setup = "pytest --setup-show"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
  "--strict-config",
  "--strict-markers",
]

[[tool.hatch.envs.test.matrix]]
python = ["3.10", "3.11", "3.12", "3.13", "3.14"]

[tool.hatch.envs.dev]
features = ["test"]
skip-install = false
dependencies = [
  "mypy>=2.3.0",
  "ruff>=0.16.0",
  "bandit>=1.9.4",
]

[tool.ruff]
extend-exclude = ["src/cwl2ro_crate/_vendor"]

[tool.ruff.lint]
# Start with the essential rules
select = [
  "F",    # Pyflakes (Critical for bugs)
  "E",    # pycodestyle Errors
  "W",    # pycodestyle Warnings
  "I",    # isort (Import sorting)
  "UP",   # pyupgrade (Modern syntax)
  "B",    # flake8-bugbear (Common bugs)
  "C4",   # flake8-comprehensions
  "SIM",  # flake8-simplify
  "FA",   # flake8-future-annotations
  "TC",   # flake8-type-checking
  "PTH",  # flake8-use-pathlib
  "RET",  # flake8-return
  "C90",  # McCabe Complexity (Enables C901)
]

# Ignore rules that conflict with the formatter (Ruff Format/Black)
ignore = [
  "E501", # Line too long (handled by formatter)
  "W191", # Tab indentation (handled by formatter)
  "E111", # Indentation issues (handled by formatter)
  "E114", # Indentation issues (handled by formatter)
  "E117", # Over-indented (handled by formatter)
]

[tool.ruff.lint.mccabe]
# Flag errors (C901) whenever complexity exceeds 10 (default is 10)
max-complexity = 10

[tool.hatch.envs.dev.scripts]
typecheck = "mypy --install-types --non-interactive {args:src tests}"
lint = "ruff format {args:src tests}"
check = "ruff check --fix {args:src tests}"
security = "bandit -r {args:src} -x src/cwl2ro_crate/_vendor"

[tool.mypy]
strict = true
exclude = ["src/cwl2ro_crate/_vendor"]

[[tool.mypy.overrides]]
module = ["cwl_loader", "cwl_loader.*", "transpiler_mate.runtime.*", "rocrate.*", "runcrate.*", "rocrate_validator.*", "bagit"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["cwl2ro_crate._vendor.*"]
follow_imports = "skip"
ignore_errors = true
